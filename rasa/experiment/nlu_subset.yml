# 148 exemples chacune (meme ordre de grandeur que les autres intentions,
# hors diagnostic qui est un cas particulier a 332 -- voir couverture large
# de problemes distincts). Vocabulaire deliberement disjoint de
# create_reclamation, qui utilise deja abondamment "plainte"/"porter
# plainte"/"deposer une plainte" dans ses propres exemples (verbes d'action :
# ouvrir/creer/deposer/vouloir un conseiller) : `plainte` ci-dessous capture
# uniquement l'EXPRESSION d'un mecontentement general, sans verbe de demande
# d'action, pour ne pas entrer en collision au moment de l'entrainement (voir
# l'incident deja vecu sur ce projet avec modify_reclamation/confirm_full_cancel
# vs deny, ou un chevauchement de vocabulaire avait fait deraper la
# classification de l'intention existante).

