    # Audit qualite NLU (collision lexicale ask_faq/diagnostic, 2026-07-21) :
    # config.yml n'alimente DIETClassifier qu'avec des featurizers bag-of-words
    # / char n-gram (CountVectorsFeaturizer word + char_wb), aucun embedding
    # semantique en amont -- deux exemples partageant beaucoup de mots-contenu
    # mais assignes a des intentions differentes sont donc un vrai bruit
    # d'etiquetage pour ce pipeline, pas une simple coincidence stylistique.
    # Mesure par recouvrement de mots-contenu (Jaccard) entre les 174 exemples
    # ask_faq et les 387 exemples diagnostic : 2 exemples ask_faq retires/
    # reformules ci-dessus car structurellement identiques au patron dominant
    # de diagnostic ("Pourquoi mon [sujet] [etat probleme] ?", 17 occurrences
    # cote diagnostic, 2 cote ask_faq avant ce correctif). diagnostic reste
    # volontairement plus fourni (387 exemples, couverture large de problemes
    # distincts, voir commentaire en fin de fichier) : le corrige ne consiste
    # donc pas a le reduire, mais a renforcer le cadrage GENERIQUE/PROCEDURAL
    # cote ask_faq sur la meme zone de vocabulaire (retrait, mot de passe,
    # connexion, compte, KYC) plutot que de compter sur plus d'exemples courts
    # -- seul le CADRAGE peut servir de signal discriminant a un modele qui ne
    # voit que des sacs de mots, pas le sens.
    - Quelle est la procédure normale pour effectuer un retrait ?
    - En général, combien de temps faut-il pour qu'un retrait soit traité ?
    - Comment se passe habituellement une réinitialisation de mot de passe ?
    - Quelle est la démarche standard pour se connecter à son compte ?
    - De manière générale, comment accède-t-on à son compte NGONI ?
    - Quelles sont les étapes classiques pour créer ou ouvrir un compte ?
    - Comment fonctionne normalement le système de connexion ?
    - Existe-t-il une procédure standard pour changer de mot de passe ?
    - Quelle est la marche à suivre habituelle pour le KYC ?
    - De façon générale, comment se déroule la vérification d'identité ?

    # Nettoyage a plus grande echelle (2026-07-21, suite au 1er correctif qui
    # a regresse -2.4pt : effet de levier trop faible sur seulement 2 exemples
    # retires + 10 renforts). Constat par grep direct : depot/transfert/
    # messagerie/notification/suspension/conformite/consentement parental
    # sont couverts par des DIZAINES d'exemples diagnostic (dont des exemples
    # annotes en entites, ex. [depot](operation_type:deposit)) mais ZERO
    # exemple ask_faq generique n'existe sur ce meme vocabulaire -- toute
    # question procedurale utilisant ces mots n'a statistiquement aucune
    # chance face a diagnostic. Les exemples ci-dessous comblent cette
    # asymetrie plutot que de retoucher les 12 collisions restantes
    # identifiees par mesure de similarite (Jaccard sur mots-contenu) qui se
    # sont averees etre, apres relecture, des questions ask_faq deja
    # correctement etiquetees (juste courtes, donc statistiquement fragiles) :
    # les retoucher aurait degrade une couverture FAQ deja valide sans
    # justification semantique, seulement pour "faire baisser un score de
    # similarite".
