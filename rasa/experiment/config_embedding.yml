language: fr

pipeline:
- name: WhitespaceTokenizer

- name: RegexFeaturizer

- name: LexicalSyntacticFeaturizer

- name: CountVectorsFeaturizer

- name: CountVectorsFeaturizer
  analyzer: char_wb
  min_ngram: 2
  max_ngram: 4

# Experiment: ajoute des features denses (embeddings CamemBERT) en plus du
# bag-of-words existant, pour tester si ca aide DIET a separer ask_faq de
# diagnostic sur du vocabulaire partage (retrait, mot de passe, compte...).
- name: LanguageModelFeaturizer
  model_name: "camembert"
  model_weights: "camembert-base"

- name: DIETClassifier
  epochs: 30
  constrain_similarities: true
  model_confidence: softmax
  number_of_transformer_layers: 2
  transformer_size: 256
  weight_sparsity: 0.8
  batch_size: 64
  learning_rate: 0.001

- name: EntitySynonymMapper

- name: ResponseSelector

- name: components.vocabulary_guard.VocabularyCoverageGuard

- name: FallbackClassifier
  threshold: 0.6
  ambiguity_threshold: 0.1
