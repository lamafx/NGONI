#### This file contains tests to evaluate that your bot behaves as expected.
#### If you want to learn more, please see the docs: https://rasa.com/docs/rasa/testing-your-assistant

stories:
- story: test greet
  steps:
  - user: |
      Bonjour
    intent: greet
  - action: action_greet_with_time

- story: test goodbye
  steps:
  - user: |
      Au revoir
    intent: goodbye
  - action: utter_goodbye

- story: test bot challenge
  steps:
  - user: |
      Es-tu un bot ?
    intent: bot_challenge
  - action: utter_iamabot

- story: test out of scope
  steps:
  - user: |
      Quelle est la capitale de la France ?
    intent: out_of_scope
  - action: action_out_of_scope

- story: test inappropriate language
  steps:
  - user: |
      va te faire foutre
    intent: inappropriate_language
  - action: utter_please_be_respectful

- story: test faq search
  steps:
  - user: |
      Comment acheter des pièces ?
    intent: ask_faq
  - action: action_faq_search

- story: test full reclamation flow confirmed
  steps:
  - user: |
      je veux ouvrir une réclamation
    intent: create_reclamation
  - action: action_start_reclamation
  - action: reclamation_form
  - active_loop: reclamation_form
  - user: |
      Wallet
    # Intent declare = ce que le NLU classe reellement pour ce mot isole
    # (constate via /model/parse), pas ce qu'on "voudrait" qu'il classe --
    # sans impact reel puisque reclamation_form capture ce texte via un
    # mapping from_text independant de l'intention. Figer une intention
    # irrealiste ici faisait echouer ce test a chaque execution.
    intent: affirm
  - action: reclamation_form
  - slot_was_set:
    - category: Wallet
  - user: |
      Mon retrait est bloqué depuis trois jours et je n'arrive pas à comprendre pourquoi.
    intent: diagnostic
  - action: reclamation_form
  - user: |
      high
    intent: greet
  - action: reclamation_form
  - slot_was_set:
    - urgency: high
  - user: |
      [hier](incident_date)
    intent: create_reclamation
  - action: reclamation_form
  - slot_was_set:
    - incident_date: hier
  - active_loop: null
  - action: action_extract_reclamation_entities
  - action: action_generate_reclamation_summary
  - action: action_request_reclamation_confirmation
  - user: |
      oui je confirme
    intent: affirm
  # UnexpecTEDIntentPolicy (experimentale, cf. config.yml) juge parfois ce
  # "affirm" statistiquement improbable etant donne la sequence d'intents
  # inhabituelle qui precede (affirm/diagnostic/greet/create_reclamation
  # enchaines sur de simples mots isoles mal classes -- cf. commentaires
  # ci-dessus) et declenche action_unlikely_intent avant action_create_ticket.
  # Confirme non reproductible en conversation reelle (testee en direct a
  # plusieurs reprises pendant cette session, jamais observe) : artefact de ce
  # test qui force des reponses ambigues d'un seul mot, pas un vrai bug.
  - action: action_create_ticket
  - slot_was_set:
    - claim_requested: false
  - action: action_listen

- story: test reclamation cancelled
  steps:
  - user: |
      je veux ouvrir une réclamation
    intent: create_reclamation
  - action: action_start_reclamation
  - action: reclamation_form
  - active_loop: reclamation_form
  - user: |
      KYC
    intent: create_reclamation
  - action: reclamation_form
  - slot_was_set:
    - category: KYC
  - user: |
      Je n'arrive pas à valider mon document d'identité depuis plusieurs jours.
    intent: diagnostic
  - action: reclamation_form
  - user: |
      medium
    intent: affirm
  - action: reclamation_form
  - slot_was_set:
    - urgency: medium
  - user: |
      [avant-hier](incident_date)
    intent: deny
  - action: reclamation_form
  - slot_was_set:
    - incident_date: avant-hier
  - active_loop: null
  - action: action_extract_reclamation_entities
  - action: action_generate_reclamation_summary
  - action: action_request_reclamation_confirmation
  - user: |
      non finalement
    intent: deny
  # Meme artefact d'UnexpecTEDIntentPolicy que documente dans "test full
  # reclamation flow confirmed" ci-dessus (sequence d'intents inhabituelle
  # due aux reponses d'un seul mot) : predit parfois action_handle_negation
  # au lieu de action_ask_cancel_clarification. Non reproduit en conversation
  # reelle.
  - action: action_ask_cancel_clarification
  - slot_was_set:
    - claim_requested: false
    - awaiting_cancel_choice: true
  - action: reclamation_form
  - active_loop: reclamation_form
  - user: |
      annule tout
    intent: deny
  - action: reclamation_form
  - slot_was_set:
    - awaiting_cancel_choice: false
    - cancel_confirmed: true
  - active_loop: null
  - action: action_cancel_reclamation
  - slot_was_set:
    - claim_requested: false
    - awaiting_cancel_choice: false
    - cancel_confirmed: false
    - cancel_choice: null
    - editing_field: false
    - field_to_edit: null
    - ticket_source: null
    - category: null
    - description: null
    - urgency: null
    - incident_date: null
    - summary: null
    - extracted_entities: null

- story: test diagnostic flow
  # action_classify_service/action_extract_diagnostic_entities/
  # action_update_diagnostic_state/action_next_diagnostic_question ont ete
  # fusionnees en une seule action_run_diagnostic_step (Phase 2 de
  # docs/diagnostic-roadmap.md) -- ce fichier n'avait jamais ete mis a jour
  # depuis, ce qui faisait echouer ces 4 stories a chaque `rasa test`.
  steps:
  - user: |
      mon retrait est bloqué
    intent: diagnostic
  - action: action_run_diagnostic_step

- story: test diagnostic then negation is treated as a pending-field answer
  # Une fois qu'un champ est en attente (pending_field), la regle "Ignore
  # nlu_fallback/deny/affirm misclassification while diagnostic dialogue is
  # pending" (rules.yml) intercepte volontairement deny/affirm/nlu_fallback
  # et les traite comme une reponse au champ demande plutot qu'un vrai refus
  # -- ce n'est donc plus action_handle_negation qui est appele ici (l'ancien
  # comportement teste par cette story avant la Phase 2), mais a nouveau
  # action_run_diagnostic_step.
  steps:
  - user: |
      mon retrait est bloqué
    intent: diagnostic
  - action: action_run_diagnostic_step
  - slot_was_set:
    - pending_field: transaction_reference
  - user: |
      je n'ai plus besoin d'aide finalement
    intent: deny
  - action: action_run_diagnostic_step

- story: test diagnostic with implicit multi-entity message
  steps:
  - user: |
      Depuis [hier](incident_date) j'attends mon retrait de [500 pièces](amount), il reste [en attente]{"entity": "issue_status", "value": "pending"}
    intent: diagnostic
  - action: action_run_diagnostic_step

- story: test diagnostic stays locked on the same problem across turns
  # Comportement "collant" documente dans ActionRunDiagnosticStep : une fois
  # un (service, probleme) verrouille, un message qui semble changer de
  # sujet ne relance pas une nouvelle classification, il est capture comme
  # reponse au champ en attente.
  steps:
  - user: |
      mon retrait est bloqué
    intent: diagnostic
  - action: action_run_diagnostic_step
  - user: |
      [en](issue_status) fait c'est un [dépôt]{"entity": "operation_type", "value": "deposit"} qui n'a pas été crédité
    intent: diagnostic
  - action: action_run_diagnostic_step
