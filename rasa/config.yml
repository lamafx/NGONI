language: fr

pipeline:

- name: SpacyNLP
  model: "fr_core_news_md"

- name: SpacyTokenizer

- name: SpacyFeaturizer
  pooling: "mean"

- name: CountVectorsFeaturizer
  analyzer: "word"
  min_ngram: 1
  max_ngram: 2
  min_df: 1

- name: CountVectorsFeaturizer
  analyzer: "char"
  min_ngram: 3
  max_ngram: 5
  min_df: 1

- name: DIETClassifier
  epochs: 80
  constrain_similarities: true

- name: FallbackClassifier
  threshold: 0.70
  ambiguity_threshold: 0.10
assistant_id: 20260728-142324-chilly-frank
