  - action: action_start_reclamation
  - action: reclamation_form
  - active_loop: reclamation_form
  - active_loop: null
  - action: action_extract_reclamation_entities
  - action: action_generate_reclamation_summary
  - action: action_request_reclamation_confirmation
  - slot_was_set:
    - claim_requested: true
  - intent: deny
  - action: action_ask_cancel_clarification
  - slot_was_set:
    - claim_requested: false
    - awaiting_cancel_choice: true
  - action: reclamation_form
  - active_loop: reclamation_form
  - slot_was_set:
    - awaiting_cancel_choice: false
    - cancel_confirmed: true
  - active_loop: null
  - action: action_cancel_reclamation
  - slot_was_set:
    - claim_requested: false
    - awaiting_cancel_choice: false
    - cancel_confirmed: false
    - cancel_choice: null
    - editing_field: false
    - field_to_edit: null
    - ticket_source: null
    - category: null
    - description: null
    - urgency: null
    - incident_date: null
    - summary: null
    - extracted_entities: null

