  - action: reclamation_form
  - active_loop: reclamation_form

- story: diagnostic then escalation to ticket
  # Un seul tour suffit : action_run_diagnostic_step positionne deja
  # diagnostic_state.status="in_progress" des qu'un champ requis manque
  # encore. Repeter ce pas une 2e fois ici (sans nouveau message utilisateur
  # entre les deux) apprenait a TEDPolicy que rejouer action_run_diagnostic_step
  # sans intent declencheur est un enchainement plausible -- ce qui lui
  # faisait ensuite rejouer cette action en trop juste apres qu'une regle
  # l'ait deja executee une fois (voir le commentaire sur ActionRunDiagnosticStep
  # dans actions.py).
  steps:
  - intent: greet
  - action: action_greet_with_time
  - intent: diagnostic
  - action: action_run_diagnostic_step
  - slot_was_set:
    - diagnostic_state: '{"status": "in_progress"}'
  - intent: create_reclamation
  - action: action_decide_escalation

- story: diagnostic then resolved by denial
  steps:
  - intent: diagnostic
  - action: action_run_diagnostic_step
  - intent: deny
  - action: action_handle_negation

