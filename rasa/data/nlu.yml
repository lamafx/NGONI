    # paraphrases tenu a l'ecart du corpus (entity_eval.py) -- rappel mesure
    # a 0 % pour incident_date et issue_status (10 et 6 occurrences testees,
    # 0 retrouvee), 33 % pour type_problem, 25 % pour platform. Les exemples
    # ci-dessus etaient trop peu nombreux et trop proches les uns des autres
    # (memes 5 dates, memes 5 statuts) pour generaliser au-dela des phrases
    # d'entrainement -- le modele n'invente jamais une entite a tort
    # (precision 1.0 sur ce meme test), il manque juste de diversite pour la
    # detecter. Ajouts ci-dessous : formulations relatives, absolues, durees
    # ecoulees, jours de semaine, registre informel/SMS, et positions
    # syntaxiques variees (debut/milieu/fin de phrase, forme isolee), pour
    # chacune des 3 valeurs categorielles fermees (issue_status, type_problem,
    # platform -- voir domain.yml) ou en texte libre (incident_date).

