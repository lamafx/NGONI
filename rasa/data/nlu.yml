    # Nettoyage 2026-07-22 : les blocs v1 (10 exemples) et v2 (28 exemples)
    # ajoutes le 2026-07-21 pour combler l'asymetrie de vocabulaire avec
    # diagnostic (depot/transfert/messagerie/notifications/suspension/
    # conformite/consentement parental) ont ete retires. Les deux avaient
    # regresse l'accuracy sur le corpus adversarial (-2.4pt puis -2.2pt,
    # avec une regression collaterale de -20pt sur out_of_scope pour v2 --
    # le vocabulaire generique ajoute, "en general"/"quelle est la
    # procedure", diluait le VocabularyCoverageGuard). Le modele reellement
    # deploye (retrained-audit-fixes-v6.tar.gz) avait deja ete reentraine
    # SANS ces exemples ; ce fichier ne correspondait donc plus au modele en
    # prod avant ce nettoyage.

    # Prefixe de politesse "Bonjour, ..." (audit "500 tours", 2026-07-18) :
    # une question de fond parfaitement claire, une fois precedee d'une
    # formule de politesse structurée en debut de phrase, se faisait
    # classer greet/nlu_fallback plutot que la vraie intention. Exemples
    # ci-dessous pour que le NLU apprenne a ignorer ce prefixe.
    - Bonjour, quel est le montant minimum de retrait, merci d'avance.
    - Bonjour, puis-je changer mon email, merci d'avance.
    - Bonjour, est-ce que mes pièces expirent un jour, merci d'avance.
    - Bonjour, comment puis-je vérifier mon identité, merci d'avance.
    - Bonjour, comment fonctionne le parrainage, merci d'avance.
    - Bonjour, pourriez-vous m'indiquer comment recharger mon compte, merci.
    # Consolides depuis rasa/data/new.yml (2026-07-30) : seuls les exemples
    # qui n'existaient pas deja ci-dessus, pour ne jamais dupliquer un
    # exemple d'entrainement.
