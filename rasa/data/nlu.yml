  # bug constate : "Je veux parler a un conseiller humain" (texte exact des
  # boutons "Contactez-nous"/"Contactez un conseiller", ChatPage.jsx) etait
  # classe bot_challenge par le classifieur few-shot (composant LLM,
  # examples_per_intent: 5) -- ses 5 premiers exemples mentionnent "humain"
  # a plusieurs reprises ("Est-ce que tu es un humain ?" en position 2),
  # alors qu'aucun des 5 premiers exemples de create_reclamation n'evoquait
  # de conseiller/humain. Les 5 PREMIERS exemples ci-dessous sont donc
  # deliberement les plus explicites et les plus proches du texte reel des
  # boutons (voir train() dans le composant de classification : seuls les
  # `examples_per_intent` premiers exemples de chaque intention, dans
  # l'ordre du fichier, entrent dans le prompt few-shot).
