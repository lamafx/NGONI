- intent: cancel_human_agent_request
  # Symetrique de request_human_agent ci-dessus : l'usager RETIRE sa demande
  # de mise en relation ("finalement ca va, je continue avec toi").
  #
  # Risque de confusion assume et traite ici : "laisse tomber" / "finalement
  # non" tout seuls appartiennent a `deny` (refus d'une proposition en cours,
  # ex. pendant le formulaire de reclamation). Les 5 PREMIERS exemples --
  # seuls a entrer dans le prompt few-shot, voir examples_per_intent dans
  # config.yml -- mentionnent donc TOUS explicitement le conseiller/l'humain
  # ou la mise en relation, jamais un simple refus. Les formulations courtes
  # et ambigues sont volontairement absentes : mieux vaut que le moteur
  # classe "non laisse tomber" en `deny` (comportement actuel, inchange) que
  # d'annuler une escalade sur un refus qui ne parlait pas d'elle.
