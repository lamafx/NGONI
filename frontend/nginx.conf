# Meme routage que le proxy de developpement (vite.config.js) :
#   /rasa/...   -> Rasa    (rasa:5005)
#   /engine/... -> FastAPI (fastapi:8000)
# L'application n'a donc pas besoin d'etre reconstruite pour Docker : elle
# appelle toujours /rasa et /engine sur sa propre origine, sans CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Envoi de pieces d'identite depuis le chat.
    client_max_body_size 20m;

    # Resolution a la demande (DNS interne de Docker) : nginx demarre meme si
    # Rasa ou FastAPI ne sont pas encore prets, au lieu de s'arreter sur
    # « host not found in upstream ».
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /rasa/ {
        set $rasa http://rasa:5005;
        rewrite ^/rasa/(.*)$ /$1 break;
        proxy_pass $rasa;
        proxy_set_header Host $host;
        # Sans GPU, une reponse du classifieur LLM peut prendre 30 a 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /engine/ {
        set $engine http://fastapi:8000;
        rewrite ^/engine/(.*)$ /$1 break;
        proxy_pass $engine;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Application monopage (HashRouter) : tout le reste sert index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
